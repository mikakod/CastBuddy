# Release pipeline.
#
#   workflow_dispatch (Actions tab -> Release -> Run workflow): DRY RUN -
#   builds both binaries and both image architectures, pushes nothing,
#   creates no release. Run this once before the first real tag to prove
#   the arm64 runner label and the whole graph.
#
#   pushing a `v*` tag: builds everything, publishes the multi-arch image
#   to GHCR (ghcr.io/<owner>/castbuddy:<version> and :latest) and opens a
#   DRAFT release with generated notes plus the binaries - review the notes
#   and click Publish.
#
# The `ubuntu-24.04-arm` label is the free arm64 runner for public repos;
# if it ever stops resolving, swap that matrix entry to `ubuntu-latest`
# and add docker/setup-qemu-action before the build step.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Jobs that publish escalate individually (packages: write, contents: write).
permissions:
  contents: read

jobs:
  verify:
    name: Verify (build + tests + dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  binary-linux:
    name: Binary (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p castbuddy
      - run: strip target/release/castbuddy
      - uses: actions/upload-artifact@v7
        with:
          name: binary-linux
          path: target/release/castbuddy
          if-no-files-found: error

  binary-windows:
    name: Binary (windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p castbuddy
      - uses: actions/upload-artifact@v7
        with:
          name: binary-windows
          path: target/release/castbuddy.exe
          if-no-files-found: error

  image:
    name: Image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Lowercase image name (GHCR rejects uppercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure build output
        # Tag builds push digest-only (merged into one manifest later);
        # dry runs keep the result in the build cache and push nothing.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "OUTPUTS=type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_ENV"
          else
            echo "OUTPUTS=type=cacheonly" >> "$GITHUB_ENV"
          fi
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: ${{ env.OUTPUTS }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Record digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          printf '%s@%s\n' "$IMAGE" "$digest" > "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    name: Publish multi-arch manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Collect digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Lowercase image name (GHCR rejects uppercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push the combined manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:latest" \
            $(cat /tmp/digests/*)

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, binary-linux, binary-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
      - name: Prepare assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp artifacts/binary-linux/castbuddy "dist/castbuddy-${version}-linux-x86_64"
          cp artifacts/binary-windows/castbuddy.exe "dist/castbuddy-${version}-windows-x86_64.exe"
          cp castbuddy.example.toml dist/
      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists (draft from an earlier run) - keeping it as-is."
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "CastBuddy $GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
