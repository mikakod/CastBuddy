# CastBuddy - hardened deployment topology.
#
# Only the share server may be reachable from outside. Everything else
# (dashboard :8080, MediaMTX RTMP/HLS/WebRTC/API, the player) stays on
# loopback inside the container. In managed mode MediaMTX runs as a child
# process of castbuddy, so it needs no published ports of its own.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# First run writes deploy/data/castbuddy.toml (default container config);
# media goes in deploy/data/media. Linux hosts: if writes fail, chown the
# data dir to uid 1000 (the container user).
services:
  castbuddy:
    image: castbuddy:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "49989:49989"           # share server - the ONLY public listener
      - "127.0.0.1:8080:8080"   # dashboard: host-loopback only (optional)
      # OBS on the host/LAN (set rtmp_bind = "0.0.0.0" in the container
      # config first - cleartext, trusted networks only):
      # - "1935:1935"
    # Intentionally NOT published:
    #   1935/1936 RTMP(S) ingest, 8888 HLS, 8889 WebRTC, 9997 API,
    #   UDP 8189 (WebRTC ICE) - all bound to loopback inside the container.
    # For remote publishers additionally publish 1936/tcp and set
    # tls_cert/tls_key + rtmps_bind in the container config.
    volumes:
      - ./data:/data            # config, logs, generated mediamtx config
      - ./data/media:/media     # server.media_dir (drop files here)
    # No RUST_LOG on purpose: the default filter is already info-level,
    # and enable-logging=false must stay able to silence the access log.
    read_only: true
    tmpfs:
      - /tmp                    # mpv IPC sockets
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
